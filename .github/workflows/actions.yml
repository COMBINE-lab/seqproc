name: Fast CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest

    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
      RUSTUP_MAX_RETRIES: 10
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          target: x86_64-unknown-linux-gnu
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: seqproc-ci

      - name: Cache Rust compiler outputs
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: fmt
        run: cargo fmt --all --check

      - name: test (unit and high-value integration targets)
        run: >-
          cargo test --locked --workspace --lib --bins
          --test cli_workflow_tests
          --test error_handling_tests
          --test paper_chemistry_tests
          --no-fail-fast
