[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# Keep release artifacts aligned with the checked-in portable Cargo target
# floors. The path is resolved relative to .github/workflows/release.yml.
github-build-setup = "../build-setup.yml"
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Release archives intentionally build the portable default feature set. The
# mutually exclusive AVX2 development feature is tested in comprehensive CI,
# but must not be combined with the default by cargo-dist metadata/builds.
all-features = false
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-apple-darwin = "macos-14"
