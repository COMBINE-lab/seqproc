[package]
name = "seqproc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A fast, programmable preprocessing engine for sequencing reads"
license = "BSD-3-Clause"
repository = "https://github.com/COMBINE-lab/seqproc"
readme = "README.md"
keywords = ["bioinformatics", "fastq", "sequencing", "preprocessing"]
categories = ["command-line-utilities", "science"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "seqproc"
path = "src/lib.rs"

[[bin]]
name = "seqproc"
path = "src/bin/bin.rs"

[dependencies]
antisequence = { version = "0.1.0", git = "https://github.com/COMBINE-lab/ANTISEQUENCE", rev = "33b7df402a6837440bd657688da5b83dca1573e3" }
rustc-hash = "1.1.0"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing = "0.1.37"
ariadne = "0.5.0"
chumsky = "0.12.0"
clap = { version = "4.4.8", features = ["derive"] }
anyhow = "1.0.103"
tempfile = "3.5.0"
nix = { version = "0.26.2", features = ["fs"] }
csv = "1.3.0"
serde = {version = "1.0.207", features = ["derive"]}
serde_json = "1.0"
blake3 = "1.8.7"
thiserror = "2.0"
flate2 = { version = "1.0", features = ["zlib-rs"], default-features = false }

[features]
default = []
# Forward allocator features to antisequence so you can run: cargo bench --features mimalloc|jemalloc
mimalloc = ["antisequence/mimalloc"]
jemalloc = ["antisequence/jemalloc"]

[dev-dependencies]
assert_cmd = "2.0.12"
similar-asserts = "1.5.0"
criterion = { version = "0.5" }
proptest = "1.4"
predicates = "3.1"

[lints.rust]
rust_2018_idioms = "warn"

[lints.clippy]
semicolon_if_nothing_returned = "warn"

[[bench]]
name = "antisequence_benches"
harness = false

[[bench]]
name = "protocol_feature_benches"
harness = false

[profile.bench]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = false
debug-assertions = false
overflow-checks = false
strip = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
